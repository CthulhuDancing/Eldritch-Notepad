name: Marketplace check

on:
  push:
    branches: [main]
  pull_request:
      paths:
      - ".agents/**"
      - ".claude-plugin/**"
      - "plugins/**"
      - "tests/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate marketplace
        run: python tests/test-marketplace.py
