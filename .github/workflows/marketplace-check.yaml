name: Marketplace check

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".agents/**"
      - ".claude-plugin/**"
      - "plugins/**"
      - "tests/**"
      - "Makefile"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository checks
        run: make check
